# Header
navname: Khang's Blog

# navigatior items
nav:
  Posts: /archives
  Projects: /projects
  Categories: /category
  Tags: /tag
  About: /about

# favicon
favicon: /favicon.ico

# Profile
nickname: Kudo Khang

### this variable is MarkDown form.
description: Every **master** was once a *beginner*.<br>Every **pro** was once an *amateur*.
avatar: /image/avatar.jpeg

# main menu navigation
## links key words should not be changed.
## Complete url after key words.
## Unused key can be commented out.
links:
  Blog: /archives
  # Category:
  # Tags:
  # Link:
  Resume: https://kudokhang.github.io/CurriculumVitae/
  # Publish:
  LinkedIn: https://www.linkedin.com/in/khangnghia/
  # FaceBook:
  # Twitter:
  # Skype:
  # CodePen:
  # Sketch:
  Gitlab: https://gitlab.com/KudoKhang
  # Instagram:
  YouTube: https://www.youtube.com/@kudokhang
  Github: https://github.com/KudoKhang

# how links show: you have 2 choice--text or icon.
links_text_enable: false
links_icon_enable: true

# Post page
## Post_meta
post_meta_enable: true

post_author_enable: false
post_date_enable: true
post_category_enable: true
## Post copyright
post_copyright_enable: false

post_copyright_author_enable: false
post_copyright_permalink_enable: false
post_copyright_license_enable: false
post_copyright_license_text: Copyright (c) 2023 <a href="http://creativecommons.org/licenses/by-nc/4.0/">CC-BY-NC-4.0</a> LICENSE
post_copyright_slogan_enable: false
post_copyright_slogan_text: Do you believe in <strong>DESTINY</strong>?
## toc
post_toc_enable: true

# Page
page_title_enable: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: MMMM D, YYYY
time_format: H:mm:ss

# stylesheets loaded in the <head>
stylesheets:
  - /css/style.css

# scripts loaded in the end of the body
scripts:
  - /js/script.js
  - /js/tocbot.min.js
    # tscanlin/tocbot: Build a table of contents from headings in an HTML document.
    # https://github.com/tscanlin/tocbot
  - /js/enhancements.js
    # UX Enhancements: Reading progress, copy code, back to top
  - /js/homepage-animation.js
    # Homepage 3D floating shapes animation
  - /js/typing-effect.js
    # Typing animation for homepage slogan


# plugin functions
## Mathjax: Math Formula Support
## https://www.mathjax.org
mathjax:
  enable: true
  import: demand # global or demand
  ## global: all pages will load mathjax,this will degrade performance and some grammers may be parsed wrong.
  ## demand: Recommend option,if your post need fomula, you can declare 'mathjax: true' in Front-matter


mermaid:
  enable: true
  version: "11.12.0"  # Phiên bản mới nhất của Mermaid.js (kiểm tra tại https://mermaid.js.org để cập nhật)
  options: {}  # Tùy chọn API, ví dụ: { startOnload: true, theme: 'forest' } - xem chi tiết tại https://mermaid.js.org/config/setup/modules/mermaidAPI.html
